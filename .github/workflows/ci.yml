name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (test, selftest, deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: linux-${{ hashFiles('Cargo.lock') }}

      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.sh linux-x64

      - name: Build (warnings are errors for the library)
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --offline --release

      - name: Test
        run: |
          # Surface failing tests as annotations: the job log is not always
          # accessible, annotations are.
          set -o pipefail
          cargo test --offline --release 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAILED|panicked at|^error' tests.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -40 tests.log
            exit 1
          fi

      - name: Type-check the Win32 shell
        run: cargo check --offline --features win32-syntax-check

      - name: Headless smoke test
        run: |
          cargo test --offline --release --test gen_fixtures -- --ignored --nocapture
          ./target/release/pdf-rust --selftest --no-db "$RUNNER_TEMP/pdf-rust-bench/benchmark-200.pdf" | tee selftest.txt

      - name: Package (.deb)
        run: ./packaging/linux/build-deb.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-rust-linux
          path: |
            dist/*.deb
            selftest.txt

  windows:
    name: Windows (build, zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Fetch PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh win-x64

      - name: Tests
        shell: pwsh
        run: |
          # Surface failing tests as annotations: the job log is not always
          # accessible, annotations are.
          cargo test --offline --release 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path tests.log -Pattern 'FAILED|panicked at' |
              Select-Object -First 10 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            Get-Content tests.log -Tail 40
            exit 1
          }

      - name: Package (portable ZIP)
        shell: pwsh
        run: ./packaging/windows/build.ps1 -SkipTests -PdfiumDll runtime/pdfium/pdfium.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-rust-windows
          path: dist/pdf-rust-*-win64.zip
