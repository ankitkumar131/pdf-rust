name: Release artifacts

# Builds the downloadable binaries for every platform and attaches them to the
# GitHub release whose tag matches the version in Cargo.toml.
#
# The in-sandbox environment cannot reach uploads.github.com, so release assets
# are produced here instead: the Linux job makes the .deb, the portable tarball
# and (when appimagetool is installable) the AppImage, and the Windows job makes
# the portable ZIP and — when NSIS is present — the installer. Both jobs check
# for `v<version>` and upload with `gh release upload`, which is a no-op when the
# release does not exist yet; the workflow artifacts are kept either way.

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: linux-release-${{ hashFiles('Cargo.lock') }}

      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.sh linux-x64

      - name: Tests
        run: cargo test --offline --release

      - name: Build release binary
        run: cargo build --offline --release

      - name: Package .deb and portable tarball
        run: |
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-portable.sh

      - name: Try to build an AppImage
        continue-on-error: true
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          # --appimage-extract works without FUSE on CI runners.
          (cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null)
          ./packaging/linux/build-appimage.sh "$version" || true
          out="dist/pdf-rust-${version}-x86_64.AppImage"
          if [ -d dist/pdf-rust.AppDir ] && [ ! -e "$out" ]; then
            ARCH=x86_64 /tmp/squashfs-root/AppRun dist/pdf-rust.AppDir "$out" || true
          fi
          ls -l dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt
          if ls *.AppImage >/dev/null 2>&1; then sha256sum *.AppImage >> SHA256SUMS.txt; fi
          cat SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-rust-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to the matching release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "attaching artifacts to $tag"
            gh release upload "$tag" dist/*.deb dist/*.tar.gz dist/SHA256SUMS.txt --clobber
            if ls dist/*.AppImage >/dev/null 2>&1; then
              gh release upload "$tag" dist/*.AppImage --clobber
            fi
          else
            echo "no release $tag yet; artifacts stay as workflow artifacts"
          fi

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-release-${{ hashFiles('Cargo.lock') }}

      - name: Fetch PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh win-x64

      - name: Tests (informational)
        continue-on-error: true
        run: cargo test --offline --release

      - name: Make sure NSIS is available
        continue-on-error: true
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsis\makensis.exe") {
            # build.ps1 looks for makensis on PATH; the choco shim is not always
            # refreshed inside the same job.
            Write-Output "$nsis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Output "makensis found at $nsis"
          } else {
            Write-Output "NSIS not installed; the installer step will be skipped"
          }

      - name: Build and package (portable ZIP)
        shell: pwsh
        run: ./packaging/windows/build.ps1 -SkipTests -SkipInstaller -PdfiumDll runtime/pdfium/pdfium.dll

      - name: Build the NSIS installer
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) { throw "makensis is not available" }
          & $makensis.Source `
            "/DAPP_VERSION=$version" `
            "/DSOURCE_DIR=$PWD\target\release" `
            "/DPDFIUM_DLL=$PWD\runtime\pdfium\pdfium.dll" `
            "$PWD\packaging\windows\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-rust-windows
          path: |
            dist/*.zip
            dist/*setup.exe
          if-no-files-found: error

      - name: Attach to the matching release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "attaching artifacts to $tag"
            gh release upload "$tag" dist/*.zip --clobber
            if ls dist/*setup.exe >/dev/null 2>&1; then
              gh release upload "$tag" dist/*setup.exe --clobber
            fi
          else
            echo "no release $tag yet; artifacts stay as workflow artifacts"
          fi

  checksums:
    name: Checksums and release notes
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: needs.linux.result == 'success' || needs.windows.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Collect the built artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        run: |
          cd assets
          rm -f SHA256SUMS.txt   # the Linux job's copy; replaced by this one
          ls -l
          sha256sum ./* > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attach the checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" SHA256SUMS.txt --clobber
            gh release view "$tag" --json assets -q '.assets[] | "\(.name)  \(.size) bytes"'
          else
            echo "no release $tag yet"
          fi
